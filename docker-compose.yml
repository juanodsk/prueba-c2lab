services:
  mongodb:
    image: mongo:8.0
    container_name: prueba-c2lab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand({ ping: 1 }).ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongodb_data:
